# Champion config: vjepa2_alertonly_v4
# Produces pgmAP_ALL=0.9101 with 12-TTA ensemble

# --- backbone ---
model_name: facebook/vjepa2-vitl-fpc64-256
freeze_backbone: true
lora_r: 16
lora_alpha: 32
lora_targets: [q_proj, v_proj]

# --- head ---
num_probe_queries: 1
mean_pool: false          # attentive probe, NOT mean pooling
use_mlp_head: false
drop_path_rate: 0.1

# --- data ---
train_csv: /workspace/datasets/nexar_collision/train.csv
val_csv: /workspace/datasets/nexar_collision/val.csv
video_dir: /workspace/datasets/nexar_collision/train
crop_size: 256
clip_frames: 16
clip_stride: 4
alert_only: true          # filter to collision-relevant frames

# --- training ---
epochs: 30
batch_size: 16
lr: 3.0e-4
weight_decay: 0.05
warmup_epochs: 2
label_smoothing: 0.0

# augmentation
mixup_alpha: 0.2
cutmix_alpha: 0.0

# SAM (Sharpness-Aware Minimization)
sam_enabled: true
sam_rho: 0.05

# group-aligned CE
group_aligned_ce: true
group_column: video_id      # align loss per video group

# --- eval / checkpoint ---
eval_metric: pgmAP_ALL      # primary metric for best-model selection
patience: 10
save_dir: ./checkpoints
