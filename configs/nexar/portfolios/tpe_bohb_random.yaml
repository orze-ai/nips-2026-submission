# Portfolio configuration for hyperparameter search policies
# Used by orze sweep engine to allocate trials across search strategies
#
# The eta-squared boundary (Section 4.2) determines when each policy
# receives budget: TPE and BOHB are favoured early, Random is kept
# as an exploration backstop.

portfolio:
  name: default_nexar_portfolio
  description: "TPE + BOHB + Random backstop for Nexar collision experiments"

policies:
  - name: tpe
    engine: optuna
    sampler: TPESampler
    weight: 0.5            # fraction of total trial budget
    pruner: HyperbandPruner
    params:
      n_startup_trials: 10
      n_ei_candidates: 24

  - name: bohb
    engine: optuna
    sampler: BOHBSampler
    weight: 0.35
    pruner: HyperbandPruner
    params:
      min_budget: 5        # minimum epochs before pruning
      max_budget: 30

  - name: random
    engine: optuna
    sampler: RandomSampler
    weight: 0.15
    pruner: NopPruner       # no pruning — exploration backstop
    params: {}

search_space:
  lr:
    type: log_uniform
    low: 1.0e-5
    high: 1.0e-3
  weight_decay:
    type: log_uniform
    low: 0.01
    high: 0.1
  lora_r:
    type: categorical
    choices: [4, 8, 16, 32]
  mixup_alpha:
    type: uniform
    low: 0.0
    high: 0.5
  drop_path_rate:
    type: uniform
    low: 0.0
    high: 0.3
  sam_rho:
    type: uniform
    low: 0.01
    high: 0.1

budget:
  max_trials: 200
  max_parallel: 4
  early_stop_plateau: 20   # stop if best hasn't improved in N trials
